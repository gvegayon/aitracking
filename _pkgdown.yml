url: https://gvegayon.github.io/aitracking/

template:
  bootstrap: 5

reference:
- title: GitHub API access
  desc: Minimal API client built on base R connections.
  contents:
  - gh_token
  - gh_api
- title: Data retrieval
  desc: Download commit histories, traffic, interactions, and languages.
  contents:
  - gh_commits
  - gh_commit_lines
  - gh_traffic
  - gh_downloads
  - gh_interactions
  - gh_assignments
  - gh_pulls
  - gh_languages
- title: Copilot usage
  desc: >
    Organization-level Copilot usage, i.e., how much the tool is used rather
    than what it left behind in the repository.
  contents:
  - gh_copilot_metrics
  - gh_copilot_seats
- title: Analysis and visualization
  desc: Classify AI involvement and summarize/plot project activity.
  contents:
  - ai_classify
  - ai_patterns
  - loc_evolution
  - plot_timeline
- title: Example data
  contents:
  - epiworld_commits
  - epiworld_interactions
  - epiworld_assignments
  - epiworld_pulls
